<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#500B13" />
      <stop offset="50%" stop-color="#A10E19" />
      <stop offset="100%" stop-color="#1C1010" />
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDE59" />
      <stop offset="45%" stop-color="#FFC400" />
      <stop offset="100%" stop-color="#F15A24" />
    </linearGradient>
    <linearGradient id="favFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D71920" />
      <stop offset="50%" stop-color="#F15A24" />
      <stop offset="100%" stop-color="#FFC400" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="100" height="100" rx="24" fill="url(#favBg)" stroke="#FFC400" stroke-width="2.5" />

  <!-- Inner delicate ring -->
  <circle cx="50" cy="50" r="43" fill="none" stroke="rgba(255, 196, 0, 0.25)" stroke-width="1" stroke-dasharray="3,3" />

  <!-- Pretodan Cloche & Flame Symbol -->
  <g transform="translate(0, 4)">
    <!-- Flame / Steam rising from cloche -->
    <path d="M 50 18 C 47 24 43 27 46 33 C 48 37 53 37 50 42 C 54 37 58 33 55 27 C 53 23 54 20 50 18 Z" fill="url(#favFlame)" filter="url(#glow)" />

    <!-- Cloche handle ball -->
    <circle cx="50" cy="42" r="3.5" fill="url(#favGold)" stroke="#500B13" stroke-width="1" />

    <!-- Cloche dome -->
    <path d="M 28 58 C 28 44 38 43 50 43 C 62 43 72 44 72 58 Z" fill="url(#favGold)" stroke="#A10E19" stroke-width="1.5" />
    
    <!-- Cloche rim base -->
    <path d="M 23 59 C 23 57.5 25 56.5 28 56.5 L 72 56.5 C 75 56.5 77 57.5 77 59 C 77 60.5 75 61.5 72 61.5 L 28 61.5 C 25 61.5 23 60.5 23 59 Z" fill="#FFF3DC" stroke="#FFC400" stroke-width="1" />

    <!-- Crossed fork and chef knife base motif -->
    <path d="M 33 66 L 67 78 M 67 66 L 33 78" stroke="url(#favGold)" stroke-width="2" stroke-linecap="round" />
    <circle cx="50" cy="72" r="3" fill="#FFC400" />
  </g>
</svg>
